[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testpilot"
version = "0.1.0"
description = "Generate and safely run pytest suites for Python functions."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "python-dotenv>=1.0",
    "radon>=6.0",
    "streamlit>=1.35,<2",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.5",
    "mutmut>=3.8.1,<4",
    "pytest>=8.0",
]
analysis = [
    "matplotlib>=3.8,<4",
    "scipy>=1.12,<2",
]

[project.scripts]
testpilot = "testpilot.cli:main"

[tool.setuptools.packages.find]
include = ["testpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
